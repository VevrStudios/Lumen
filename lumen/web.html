<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%231a1418'/%3E%3Cg style='mix-blend-mode:screen'%3E%3Ccircle cx='52' cy='54' r='20' fill='%23f06aa8'/%3E%3Ccircle cx='68' cy='54' r='20' fill='%23a16ae0'/%3E%3Ccircle cx='64' cy='68' r='20' fill='%23f0684e'/%3E%3Ccircle cx='54' cy='66' r='20' fill='%23f2b04a'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:oklch(0.155 0.008 320)}
select option{background:oklch(0.215 0.012 320);color:oklch(0.95 0.006 320)}
body{color:oklch(0.95 0.006 320);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
textarea::placeholder{color:oklch(0.63 0.012 320)}
button:disabled{cursor:default!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:oklch(1 0 0 / 0.09);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hv4:hover{box-shadow:inset 0 0 0 100px oklch(1 0 0 / 0.04)!important}
.hv5:hover{box-shadow:inset 0 0 0 100px oklch(1 0 0 / 0.05)!important}
.hvRed:hover{background:oklch(0.68 0.17 25)!important;color:oklch(0.17 0.01 320)!important}
.hvHandle:hover{background:oklch(1 0 0 / 0.035)!important}
.hvPlus:hover{background:oklch(1 0 0 / 0.11)!important}
.hvLook:hover{background:oklch(0.86 0.13 95 / 0.2)!important}
@keyframes animRise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes animFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes animFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(9%,-7%)}66%{transform:translate(-7%,8%)}}
@keyframes animHop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-75%)}}
@keyframes animBreath{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
@keyframes animPulse{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.35;transform:translateY(-3px)}}
@keyframes animLevel{0%,100%{transform:scale(.7)}30%{transform:scale(1.3)}55%{transform:scale(.85)}80%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { html, render, Component } from "/preact.js";

const C = { ink: "oklch(0.95 0.006 320)", dim: "oklch(0.78 0.01 320)", faint: "oklch(0.63 0.012 320)", dark: "oklch(0.17 0.01 320)" };
const A = { bot: [0.76, 0.15, 355], me: [0.72, 0.14, 305], mem: [0.70, 0.14, 280], ohr: [0.68, 0.17, 25], gast: [0.76, 0.13, 50], code: [0.80, 0.13, 72], auge: [0.86, 0.13, 95] };
const col = (k, a) => { const [l, c, h] = A[k]; return a == null ? `oklch(${l} ${c} ${h})` : `oklch(${l} ${c} ${h} / ${a})`; };
const soft = (k) => { const [l, c, h] = A[k]; return `oklch(${Math.min(l + 0.08, 0.93).toFixed(2)} ${(c * 0.78).toFixed(3)} ${h})`; };

// Werkzeug -> Filter der Aktivitaet. Die Verben selbst kommen vom Server (web._VERB).
const CAT = { Read: "lesen", Grep: "lesen", Glob: "lesen", WebSearch: "lesen", WebFetch: "lesen",
  Write: "schreiben", Edit: "schreiben", MultiEdit: "schreiben",
  screenshot: "bildschirm", hinsehen: "bildschirm",
  open: "steuern", schreiben: "steuern" };
const CATK = { lesen: "gast", schreiben: "mem", bildschirm: "auge", steuern: "ohr", sonst: "bot" };
const VIA = { getippt: "Fenster", gesprochen: "gesprochen", discord: "DM" };  // durch tr()
const W0 = { notes: 320, act: 300 };
const KEY_W = "lumen-spalten", KEY_COLS = "lumen-sichtbar";
// Die Schalter in den Einstellungen. Die Vorgaben und die Grenze stehen im Code (mode.FEATURES,
// guard.FEATURE_OF) -- hier nur, wie sie heissen und was sie tun.
const FEATURES = [
  ["watch", "Beobachten", "Sieht ab und zu nach, welches Programm vorne ist, und darf Bildschirmfotos machen. Hilft beim Dranbleiben."],
  ["open", "Programme öffnen", "Darf Programme starten und Adressen im Browser öffnen."],
  ["discord", "Discord", "DMs über deinen eigenen Bot: du schreibst ihm, er antwortet dort und meldet sich auch von selbst."],
];
const IMG = /\.(png|jpe?g|gif|webp|bmp)$/i;
const LOOK = "Schau dir meinen Bildschirm an.";

// Die Wörter des Fensters. Deutsch ist der Quelltext; eine andere Sprache bringt ihre
// Tabelle mit jedem /state mit (lang/<sprache>.UI), und was darin fehlt, bleibt deutsch.
let UI = {};
const tr = (de, vals) => {
  let s = UI[de] || de;
  for (const k in vals || {}) s = s.split("{" + k + "}").join(vals[k]);
  return s;
};
const VOICE_LABEL = { female: "weiblich", male: "männlich" };

const pad = (n) => String(n).padStart(2, "0");
const clock = (iso) => { if (!iso) return ""; const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const day = (iso) => { if (!iso) return ""; const d = new Date(iso); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "."; };
// Heute nur die Uhrzeit, aeltere Eintraege mit Datum -- die Liste reicht eine Woche zurueck.
const when = (iso) => !iso ? "" : new Date(iso).toDateString() === new Date().toDateString() ? clock(iso) : day(iso) + " " + clock(iso);
const minsLeft = (iso) => Math.max(1, Math.ceil((new Date(iso) - Date.now()) / 60000));
const minsSince = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
const load = (k, ok, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); if (v && ok(v)) return v; } catch {} return d; };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fmtSize = (b) => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1).replace(".", ",") + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";
const extOf = (name) => name.includes(".") ? name.split(".").pop().slice(0, 4).toUpperCase() : tr("DATEI");

// "[Anhang: C:\...\data\dm\web_1730_bild.png]" -- so landet ein Anhang im Faden, aus der
// DM wie aus dem Fenster. Fuers Anzeigen wieder auseinandernehmen.
function splitAsked(asked) {
  const att = [], text = [];
  for (const line of (asked || "").split("\n")) {
    const m = /^\[(?:Anhang|Attachment): (.+)\]$/.exec(line.trim());
    if (!m) { text.push(line); continue; }
    const file = m[1].split(/[\\/]/).pop(), name = file.replace(/^(web_)?\d+_/, "");
    att.push({ id: file, name, ext: extOf(name), kind: IMG.test(file) ? "img" : "file", url: "/file/" + encodeURIComponent(file) });
  }
  return { text: text.join("\n").trim(), att };
}

function orb(size, mode) {
  const cols = ["oklch(0.74 0.18 355)", "oklch(0.66 0.19 305)", "oklch(0.70 0.18 25)", "oklch(0.84 0.15 75)"];
  const rest = [[-0.13, -0.09], [0.13, -0.07], [0.09, 0.13], [-0.11, 0.11]], row = [-0.39, -0.13, 0.13, 0.39];
  const d = Math.round(size * 0.66), o = (size - d) / 2;
  return html`<span style="position:relative;display:block;width:${size}px;height:${size}px;flex:none;isolation:isolate">
    ${cols.map((c, i) => {
      const think = mode === "think";
      const x = think ? row[i] * size : rest[i][0] * size, y = think ? 0 : rest[i][1] * size, s = think ? 0.34 : mode === "listen" ? 0.92 : 1;
      let anim = "none";
      if (mode === "think") anim = `animHop 1s ease-in-out ${i * 0.13}s infinite`;
      else if (mode === "listen") anim = `animLevel .9s ease-in-out ${i * 0.11}s infinite`;
      else if (mode === "idle") anim = `animFloat ${6 + i * 1.3}s ease-in-out ${-i * 1.7}s infinite`;
      const off = mode === "off";
      return html`<span key=${i} style="position:absolute;left:${o}px;top:${o}px;width:${d}px;height:${d}px;transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s});transition:transform .55s cubic-bezier(.3,1.4,.5,1)">
        <span style="display:block;width:100%;height:100%;border-radius:50%;background:${off ? "oklch(0.42 0.005 320)" : c};mix-blend-mode:screen;opacity:${off ? 0.6 : 0.92};box-shadow:${off ? "none" : `0 0 ${Math.round(size * 0.32)}px ${c}`};transition:background .6s,box-shadow .6s;animation:${anim}"></span>
      </span>`;
    })}
  </span>`;
}

const dots = (k) => html`<span style="display:flex;gap:4px;align-items:center;height:10px">
  ${[0, 1, 2].map((i) => html`<span key=${i} style="width:5px;height:5px;border-radius:50%;background:${col(k)};animation:animPulse 1.2s ease-in-out ${i * 0.15}s infinite"></span>`)}
</span>`;

function earIcon(kind) {
  const dot = (size, extra) => html`<span style="display:block;width:${size}px;height:${size}px;border-radius:50%;background:${col("ohr")};${extra}"></span>`;
  if (kind === "rec") return dot(11, "animation:animLevel .9s ease-in-out infinite");
  if (kind === "pause") return dot(10, "opacity:.55");
  if (kind === "busy") return dot(10, "animation:animBreath 1s ease-in-out infinite");
  if (kind === "ready") return dot(8, "animation:animBreath 2.8s ease-in-out infinite");
  return html`<span style="display:block;width:8px;height:8px;border-radius:50%;background:${C.faint}"></span>`;
}

// Ihr Markdown, soweit sie es schreibt: **fett**, *kursiv*, `code`, ~~durch~~, # Ueberschrift.
// Als Elemente, nie als innerHTML -- der Text kommt auch von Gaesten aus der DM.
const MD = /(\*\*[^\n]+?\*\*|__[^\s_][^\n]*?__|~~[^\n]+?~~|`[^`\n]+`|\*[^\s*][^\n*]*?\*)/;
function inline(text) {
  return text.split(MD).map((p, i) => {
    if (i % 2 === 0) return p;
    if (p.startsWith("**") || p.startsWith("__")) return html`<strong style="font-weight:700">${inline(p.slice(2, -2))}</strong>`;
    if (p.startsWith("~~")) return html`<s>${inline(p.slice(2, -2))}</s>`;
    if (p.startsWith("`")) return html`<code style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.9em;padding:1px 5px;border-radius:6px;background:oklch(1 0 0 / 0.08)">${p.slice(1, -1)}</code>`;
    return html`<em>${inline(p.slice(1, -1))}</em>`;
  });
}
const fmt = (text) => (text || "").split("\n").map((line, i) => {
  const h = /^#{1,6}\s+(.*)$/.exec(line);
  return [i ? "\n" : "", h ? html`<strong style="font-weight:700">${inline(h[1])}</strong>` : inline(line)];
});

const img = (url, name, style) => url ? html`<img src=${url} alt=${name} style="display:block;${style}" />` : null;

// Welche Farbe eine Notiz traegt, aus dem, was sie gesehen hat.
function thoughtKey(saw) {
  const s = (saw || []).join(" ");
  if (/^(wecker|alarm)/i.test(s)) return "gast";
  if (/Merken|Schreiblauf/.test(s)) return "mem";
  return "auge";
}

function actKey(a) {
  if (a.job === "remember") return "mem";
  const l = a.label || "";
  if (l === tr("Blick")) return "auge";
  if (l === tr("Wecker")) return "gast";
  return "bot";
}
const actLabel = (a) => a.job === "remember" ? tr("Merken · ins Gedächtnis eintragen") : a.label || tr("Zug");

// Toast unten rechts, sobald sie einen Gedanken schreibt -- damit das Fenster minimiert
// sein darf und er trotzdem mitbekommt, dass sie hinsieht. Nur wenn die Seite versteckt
// ist: steht sie offen, liest er die Notizen ohnehin.
// shortcut: haengt am Poll, und ein verstecktes Tab drosselt der Browser auf einmal pro
// Minute -- der Toast kann bis zu 60 s hinterherhinken. Stoert das, /state als Long-Poll.
let lastThought = null, lastToast = null;
function toastThought(entries) {
  const newest = entries.length ? entries[entries.length - 1] : null;
  const at = newest ? newest.at : "", known = lastThought;
  lastThought = at;
  if (known === null || at === known || !newest || !newest.thought) return;
  if (!document.hidden || !window.Notification || Notification.permission !== "granted") return;
  try {
    // Eigener tag je Gedanke: unter demselben tag ersetzt Windows die Meldung, und ein
    // Ersetzen ploppt nicht wieder auf (gemessen 17.09.2026). Die vorige selbst schliessen.
    if (lastToast) lastToast.close();
    lastToast = new Notification((newest.saw || []).join(" · ") || document.title, { body: newest.thought, tag: newest.at });
    lastToast.onclick = () => window.focus();
  } catch {}
}
function askNotify() {
  // Chrome unterdrueckt die Frage ohne Klick, darum beim Laden *und* beim ersten Klick.
  if (window.Notification && Notification.permission === "default") { try { Notification.requestPermission(); } catch {} }
}

const post = (path, body) => fetch(path, { method: "POST", body: body === undefined ? undefined : typeof body === "string" ? body : JSON.stringify(body) });

class App extends Component {
  state = {
    s: null, off: false, stopping: false, confirm: false,
    draft: "", focus: false, filter: "alle",
    w: load(KEY_W, (v) => v.notes && v.act, { ...W0 }), drag: null,
    cols: load(KEY_COLS, (v) => typeof v.notes === "boolean", { notes: true, act: true }),
    pending: null, pendingSent: "", pendingAt: "", pendingAtt: [],
    att: [], dropOver: false, lightbox: null, ptt: false, merken: false,
    // Einstellungen: offen?, die Eingaben darin, und was der Server zuletzt dazu sagte.
    setup: false, nameDraft: null, botDraft: null, keyDraft: "", regionDraft: null, tokenDraft: "", userDraft: null,
    setupMsg: "", setupBusy: false, deep: false,
  };
  askedSetup = false;  // beim allerersten Start einmal von selbst aufmachen
  firstSeen = new Map();  // key -> wann zuerst gezeichnet; nur Neues steigt animiert auf
  loaded = false;
  nextId = 1;

  componentDidMount() {
    this.poll();
    this.kd = (e) => {
      if (e.key !== "Escape") return;
      if (this.state.lightbox) this.setState({ lightbox: null });
      else if (this.state.setup) this.closeSetup();
      else if (this.state.confirm) this.setState({ confirm: false });
    };
    window.addEventListener("keydown", this.kd);
    askNotify();
    document.addEventListener("click", askNotify, { once: true });
  }

  componentDidUpdate() {
    // Neue Blase, neuer Status, anderer Chat: immer nach unten.
    // Ohne smooth: ein weiches Scrollen zielt auf die Hoehe von eben, und was danach noch
    // waechst -- ein Bild, das nachlaedt -- blieb darunter liegen.
    if (!this.scrollKey || this.scrollKey === this._lastKey) return;
    this._lastKey = this.scrollKey;
    this.pinned = true;
    if (this.stream) this.stream.scrollTop = this.stream.scrollHeight;
  }

  // Haelt den Chat unten, solange er nicht selbst hochgescrollt hat: auch wenn Inhalt spaeter
  // waechst (Bilder, Schrift) oder die Eingabe hoeher wird und den Chat kleiner macht.
  stick = (el) => {
    if (el === this.stream) return;
    if (this.ro) this.ro.disconnect();
    this.stream = el; this.pinned = true;
    if (!el) return;
    el.onscroll = () => { this.pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 40; };
    this.ro = new ResizeObserver(() => { if (this.pinned) el.scrollTop = el.scrollHeight; });
    this.ro.observe(el); this.ro.observe(el.firstElementChild);
  };

  async poll() {
    let wait = 2000;
    try {
      const s = await (await fetch("/state")).json();
      UI = s.ui || {};
      document.documentElement.lang = (s.settings || {}).language || "en";
      const patch = { s, off: false };
      // Seine Antwort erkennt sie am Zug selbst, nicht an der Laenge der Liste: die ist
      // gedeckelt und waechst ab dem 60. Zug nie mehr -- daran blieb "denkt nach" haengen.
      const st = this.state;
      if (st.pending != null && (s.chat || []).some((e) => e.at > st.pendingAt && e.asked === st.pendingSent)) {
        patch.pending = null; patch.pendingAtt = [];
      }
      if (!this.askedSetup && s.settings && !s.settings.welcomed) { this.askedSetup = true; patch.setup = true; }
      this.setState(patch);
      toastThought(s.thoughts || []);
      wait = s.poll_ms || 1500;
    } catch {
      this.setState({ off: true });
    }
    setTimeout(() => this.poll(), wait);
  }

  lastStep() {
    const d = this.state.s && this.state.s.denkt;
    if (!d || !d.busy || !d.steps.length) return "";
    const x = d.steps[d.steps.length - 1];
    return (x.verb + " " + x.on).trim();
  }
  fresh(key) {
    if (!this.firstSeen.has(key)) this.firstSeen.set(key, this.loaded ? Date.now() : 0);
    return Date.now() - this.firstSeen.get(key) < 1200;
  }

  // --- Eingaben ---------------------------------------------------------------------

  async send(text, withAtt) {
    const st = this.state;
    text = (text || "").trim();
    const att = withAtt ? st.att : [];
    if ((!text && !att.length) || st.off) return;
    // Erst zeichnen, dann schicken: die eigene Zeile gehoert in den Chat, sobald Enter
    // gedrueckt ist, nicht erst wenn die Antwort fertig ist.
    const before = st.s.chat || [];
    this.setState({ pending: text, pendingAtt: att,
      pendingAt: before.length ? before[before.length - 1].at : "",
      ...(withAtt ? { draft: "", att: [] } : {}) });
    const lines = [];
    for (const a of att) {
      try {
        const r = await (await fetch("/upload?name=" + encodeURIComponent(a.name), { method: "POST", body: a.file })).json();
        lines.push(r.ok ? `[${tr("Anhang")}: ${r.path}]` : `[${tr("Anhang")} ${a.name}: ${tr("zu groß -- nicht geladen")}]`);
      } catch { lines.push(`[${tr("Anhang")} ${a.name}: ${tr("ließ sich nicht laden")}]`); }
    }
    const sent = [text, ...lines].filter(Boolean).join("\n");
    this.setState({ pendingSent: sent });
    await post("/say", { text: sent, deep: st.deep });
    if (st.deep) this.setState({ deep: false });  // gilt für genau eine Antwort
  }

  // --- Einstellungen ----------------------------------------------------------------

  async configure(body) {
    // Der Server prueft und speichert; das Fenster zeigt nur, was zurueckkommt.
    this.setState({ setupBusy: true, setupMsg: "" });
    try {
      const r = await (await post("/settings", body)).json();
      const s = { ...this.state.s, settings: r.settings };
      this.setState({ s, setupBusy: false, setupMsg: r.ok ? "" : r.why,
        ...(r.ok && (body.azure_key || body.azure_region || body.azure_clear) ? { keyDraft: "", regionDraft: null } : {}),
        ...(r.ok && body.name != null ? { nameDraft: null } : {}),
        ...(r.ok && body.assistant != null ? { botDraft: null } : {}),
        ...(r.ok && (body.discord_token || body.discord_user || body.discord_clear) ? { tokenDraft: "", userDraft: null } : {}) });
    } catch { this.setState({ setupBusy: false, setupMsg: tr("Keine Verbindung.") }); }
  }

  async closeSetup() {
    // Was in den Namensfeldern steht, gilt beim Schliessen als gespeichert -- sonst ging ein
    // getippter Name mit "Fertig" still verloren. Lehnt der Server ab, bleibt das Fenster offen.
    const st = this.state, body = {};
    if (st.botDraft != null) body.assistant = st.botDraft.trim();
    if (st.nameDraft != null) body.name = st.nameDraft;
    if (!(st.s.settings || {}).welcomed) body.welcomed = true;  // von selbst nur beim ersten Start
    if (Object.keys(body).length) await this.configure(body);
    if (!this.state.setupMsg) this.setState({ setup: false });
  }

  async desktop() {
    this.setState({ setupBusy: true, setupMsg: "" });
    try {
      const r = await (await post("/desktop")).json();
      this.setState({ setupBusy: false, desktopDone: r.ok, setupMsg: r.ok ? "" : r.why });
    } catch { this.setState({ setupBusy: false, setupMsg: tr("Keine Verbindung.") }); }
  }

  async voiceTest() {
    this.setState({ setupBusy: true, setupMsg: "" });
    try {
      const r = await (await post("/voicetest")).json();
      this.setState({ setupBusy: false, setupMsg: r.ok ? "" : tr("Kein Ton — Schlüssel oder Region stimmen nicht (Details im Log).") });
    } catch { this.setState({ setupBusy: false, setupMsg: tr("Keine Verbindung.") }); }
  }

  addFiles(list) {
    const fs = Array.from(list || []);
    if (!fs.length) return;
    const add = fs.slice(0, 10).map((f) => {
      const isImg = /^image\//.test(f.type || ""), name = f.name || (isImg ? tr("Bild") + ".png" : tr("Datei"));
      return { id: "a" + this.nextId++, file: f, name, size: fmtSize(f.size || 0), ext: extOf(name), kind: isImg ? "img" : "file", url: isImg ? URL.createObjectURL(f) : "" };
    });
    this.setState((s) => ({ att: [...s.att, ...add].slice(0, 10), dropOver: false }));
  }
  removeAtt(id) {
    this.setState((s) => { const a = s.att.find((x) => x.id === id); if (a && a.url) URL.revokeObjectURL(a.url); return { att: s.att.filter((x) => x.id !== id) }; });
  }

  ptt(down) {
    if (this.state.ptt === down) return;
    this.setState({ ptt: down });
    post("/ptt", { down });
  }

  flip(k) {
    const m = this.state.s.mode;
    // Beide Schalter leben in mode.py. Das Fenster kippt sie nur, ohne eigene Kopie.
    if (k === "blind") post("/mode", { blind: m.blind ? 0 : 30 });
    if (k === "convo") post("/mode", { convo: m.convo ? 0 : 30 });
    if (k === "test") post("/mode", { test: m.testing ? 0 : 120 });
    if (k === "deaf") post("/mode", { deaf: !m.deaf });

          ${label(tr("Sprache"))}
          <select disabled=${st.setupBusy} onChange=${(e) => this.configure({ language: e.target.value })} style="${field};cursor:pointer;appearance:auto">
            ${Object.entries(cfg.languages || {}).map(([k, v]) => html`<option key=${k} value=${k} selected=${cfg.language === k}>${v}</option>`)}
          </select>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          ${label(tr("Wie soll dein Assistent heißen?"))}
          <form onSubmit=${(e) => { e.preventDefault(); this.configure({ assistant: (st.botDraft ?? "").trim() }); }} style="display:flex;gap:8px">
            <input value=${st.botDraft ?? bot} onInput=${(e) => this.setState({ botDraft: e.target.value })} maxlength="20" title=${tr("Ein Wort — es ist auch das Weckwort fürs Mikrofon.")} style="flex:1;${field}" />
            <button type="submit" disabled=${st.setupBusy || st.botDraft == null} style=${btn(st.botDraft == null ? "oklch(1 0 0 / 0.06)" : col("bot"), st.botDraft == null ? C.faint : C.dark)}>${tr("Speichern")}</button>
          </form>
          <span style="font-size:12px;color:${C.faint}">${tr("Ein Wort, 2 bis 20 Buchstaben. Ist auch das Weckwort fürs Mikrofon. Leer lassen und speichern setzt die Vorgabe zurück.")}</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          ${label(tr("Wie soll {bot} dich nennen?", { bot }))}
          <form onSubmit=${(e) => { e.preventDefault(); this.configure({ name: st.nameDraft ?? cfg.name ?? "" }); }} style="display:flex;gap:8px">
            <input value=${st.nameDraft ?? cfg.name ?? ""} onInput=${(e) => this.setState({ nameDraft: e.target.value })} placeholder=${me} maxlength="40" style="flex:1;${field}" />
            <button type="submit" disabled=${st.setupBusy || st.nameDraft == null} style=${btn(st.nameDraft == null ? "oklch(1 0 0 / 0.06)" : col("bot"), st.nameDraft == null ? C.faint : C.dark)}>${tr("Speichern")}</button>
          </form>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          ${label(tr("Stimme"))}
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${(cfg.voices || []).map((v) => html`
              <button key=${v} class="hv5" onClick=${() => this.configure({ voice: v })} disabled=${st.setupBusy} style=${btn(cfg.voice === v ? col("bot", 0.2) : "oklch(1 0 0 / 0.05)", cfg.voice === v ? soft("bot") : C.dim)}>${tr(VOICE_LABEL[v] || v)}</button>`)}
          </div>
          ${cfg.azure ? html`
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="flex:1;min-width:180px;font-size:13px;color:${C.dim}">${tr("Azure-Konto eingerichtet")}${cfg.region ? " · " + tr("Region") + " " + cfg.region : ""}.</span>
              <button class="hv5" onClick=${() => this.voiceTest()} disabled=${st.setupBusy} style=${btn(col("bot", 0.16), soft("bot"))}>${tr("Stimme testen")}</button>
              <button class="hvRed" onClick=${() => this.configure({ azure_clear: true })} disabled=${st.setupBusy} style=${btn("transparent", "oklch(0.80 0.13 25)")}>${tr("Entfernen")}</button>
            </div>` : html`
            <span style="font-size:13px;color:${C.dim};text-wrap:pretty">${tr("Ohne Azure-Konto bleibt {bot} stumm und antwortet nur hier im Fenster. Ein kostenloses Konto reicht (500.000 Zeichen im Monat frei): im Azure-Portal einen „Speech“-Dienst anlegen, dann unter „Schlüssel und Endpunkt“ einen Schlüssel und die Region kopieren.", { bot })}</span>
            <form onSubmit=${(e) => { e.preventDefault(); this.configure({ azure_key: st.keyDraft, azure_region: st.regionDraft ?? "" }); }} style="display:flex;gap:8px;flex-wrap:wrap">
              <input type="password" autocomplete="off" value=${st.keyDraft} onInput=${(e) => this.setState({ keyDraft: e.target.value })} placeholder=${tr("Schlüssel")} style="flex:2 1 200px;${field}" />
              <input value=${st.regionDraft ?? ""} onInput=${(e) => this.setState({ regionDraft: e.target.value })} placeholder=${tr("Region")} title=${tr("z.B. westeurope oder germanywestcentral")} style="flex:1 1 140px;${field}" />
              ${(() => { const ok = !st.setupBusy && st.keyDraft.trim() && (st.regionDraft || "").trim(); return html`
              <button type="submit" disabled=${!ok} style=${btn(ok ? col("bot") : "oklch(1 0 0 / 0.06)", ok ? C.dark : C.faint)}>${tr("Speichern")}</button>`; })()}
            </form>`}
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          ${label("Discord")}
          ${cfg.discord_ready ? html`
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="flex:1;min-width:180px;font-size:13px;color:${C.dim}">${tr("Bot eingerichtet für ID {id}", { id: cfg.discord_user })} · ${tr(cfg.discord === "aus" ? "Schalter unten ist aus" : cfg.discord)}.</span>
              <button class="hvRed" onClick=${() => this.configure({ discord_clear: true })} disabled=${st.setupBusy} style=${btn("transparent", "oklch(0.80 0.13 25)")}>${tr("Entfernen")}</button>
            </div>` : html`
            <span style="font-size:13px;color:${C.dim};text-wrap:pretty">${tr("Mit einem eigenen Discord-Bot kannst du {bot} auch per DM schreiben. Im Discord Developer Portal eine Anwendung anlegen, unter „Bot“ den Token kopieren und den Bot über „OAuth2“ (Scope „bot“) auf einen Server einladen, auf dem du bist. Deine eigene ID: in Discord den Entwicklermodus einschalten, Rechtsklick auf dich, „ID kopieren“.", { bot })}</span>
            <form onSubmit=${(e) => { e.preventDefault(); this.configure({ discord_token: st.tokenDraft, discord_user: st.userDraft ?? "" }); }} style="display:flex;gap:8px;flex-wrap:wrap">
              <input type="password" autocomplete="off" value=${st.tokenDraft} onInput=${(e) => this.setState({ tokenDraft: e.target.value })} placeholder=${tr("Bot-Token")} style="flex:2 1 200px;${field}" />
              <input value=${st.userDraft ?? ""} onInput=${(e) => this.setState({ userDraft: e.target.value })} placeholder=${tr("Deine Discord-ID")} style="flex:1 1 160px;${field}" />
              ${(() => { const ok = !st.setupBusy && st.tokenDraft.trim() && (st.userDraft || "").trim(); return html`
              <button type="submit" disabled=${!ok} style=${btn(ok ? col("bot") : "oklch(1 0 0 / 0.06)", ok ? C.dark : C.faint)}>${tr("Speichern")}</button>`; })()}
            </form>`}
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          ${label(tr("Mikrofon"))}
          <select disabled=${st.setupBusy || !cfg.whisper} onChange=${(e) => { const v = e.target.value;
              this.configure(v === "__aus__" ? { features: { ear: false } } : { mic: v, features: { ear: true } }); }}
            style="${field};cursor:pointer;appearance:auto">
            <option value="__aus__" selected=${!F.ear}>${tr("Aus — {bot} hört nichts und spricht nicht laut", { bot })}</option>
            <option value="" selected=${F.ear && !cfg.mic}>${tr("Windows-Standard")}</option>
            ${(cfg.mics || []).map((m) => html`<option key=${m} value=${m} selected=${F.ear && cfg.mic === m}>${m}</option>`)}
          </select>
          ${F.ear && (cfg.models || []).length > 1 && html`
            <select disabled=${st.setupBusy} onChange=${(e) => this.configure({ whisper_model: e.target.value })} title=${tr("Größere Modelle hören genauer, brauchen auf der CPU aber länger für jeden Satz.")} style="${field};cursor:pointer;appearance:auto">
              ${cfg.models.map((m) => html`<option key=${m} value=${m} selected=${cfg.model === m}>${tr("Sprachmodell:")} ${m}</option>`)}
            </select>`}
          <span style="font-size:12px;color:${C.faint};text-wrap:pretty">${cfg.whisper
            ? tr("Hört auf „{bot}“ oder die Sprechtaste Alt+Y. Whisper läuft lokal, kein Ton verlässt den Rechner.", { bot })
              + " " + tr("Auf Laptops empfehlen wir, das Mikrofon auszulassen: Whisper hört ständig mit und belastet Akku und Prozessor.")
            : tr("Whisper ist noch nicht installiert: tools\\install-whisper.ps1 einmal ausführen, dann neu starten.")}</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          ${label(tr("Start"))}
          <button class="hv4" disabled=${st.setupBusy} onClick=${() => this.configure({ autostart: !cfg.autostart })} style="display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;border:0;background:${cfg.autostart ? col("bot", 0.1) : "oklch(1 0 0 / 0.035)"};color:${C.ink};font:inherit;text-align:left;cursor:pointer">
            <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span style="font-size:13.5px;font-weight:600">${tr("Mit Windows starten")}</span>
              <span style="font-size:12.5px;color:${C.dim}">${tr("Legt eine Verknüpfung in den Autostart-Ordner. Das Fenster geht beim Anmelden mit auf.")}</span>
            </span>
            <span style="position:relative;width:42px;height:24px;border-radius:999px;background:${cfg.autostart ? col("bot") : "oklch(1 0 0 / 0.12)"};transition:background .3s">
              <span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:oklch(0.98 0 0);transform:translateX(${cfg.autostart ? "18px" : "0"});transition:transform .35s cubic-bezier(.3,1.4,.5,1)"></span>
            </span>
          </button>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px">
            <span style="flex:1;min-width:180px;font-size:12.5px;color:${C.dim}">${st.desktopDone ? tr("Verknüpfung liegt auf dem Desktop.") : tr("Eine Verknüpfung „{bot}“ auf den Desktop legen.", { bot })}</span>
            <button class="hv5" onClick=${() => this.desktop()} disabled=${st.setupBusy} style=${btn(col("bot", 0.16), soft("bot"))}>${tr("Auf den Desktop")}</button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          ${label(tr("Was {bot} darf", { bot }))}
          ${FEATURES.filter(([id]) => id !== "discord" || cfg.discord_ready).map(([id, name, what]) => {
            const on = !!F[id], blocked = id === "ear" && !cfg.whisper && !on;
            return html`
              <button key=${id} class="hv4" disabled=${st.setupBusy || blocked} onClick=${() => this.configure({ features: { [id]: !on } })} style="display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;border:0;background:${on ? col("bot", 0.1) : "oklch(1 0 0 / 0.035)"};color:${C.ink};font:inherit;text-align:left;cursor:pointer;opacity:${blocked ? 0.55 : 1}">
                <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                  <span style="font-size:13.5px;font-weight:600">${tr(name)}</span>
                  <span style="font-size:12.5px;color:${C.dim};text-wrap:pretty">${blocked ? tr("Whisper ist noch nicht installiert: tools\\install-whisper.ps1 einmal ausführen, dann neu starten.") : tr(what)}</span>
                </span>
                <span style="position:relative;width:42px;height:24px;border-radius:999px;background:${on ? col("bot") : "oklch(1 0 0 / 0.12)"};transition:background .3s">
                  <span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:oklch(0.98 0 0);transform:translateX(${on ? "18px" : "0"});transition:transform .35s cubic-bezier(.3,1.4,.5,1)"></span>
                </span>
              </button>`;
          })}
        </div>

        ${st.setupMsg && html`<span style="font-size:13px;font-weight:600;color:oklch(0.84 0.11 25)">${st.setupMsg}</span>`}
        <div style="display:flex;justify-content:flex-end">
          <button onClick=${() => this.closeSetup()} style=${btn("oklch(1 0 0 / 0.07)", C.ink)}>${tr("Fertig")}</button>
        </div>
      </div>
    </div>`}
</div>`;
  }
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
